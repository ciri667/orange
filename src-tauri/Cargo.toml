[package]
name = "orange"
version = "0.1.0"
description = "Local-first knowledge base agent assistant"
authors = ["橘记"]
license = "Apache-2.0"
edition = "2021"
# 存在多个 [[bin]]（orange 与 orange-mcp-fixture），必须指定默认二进制，否则 `cargo run` 无法确定运行目标。
default-run = "orange"

[lib]
name = "orange_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "orange"
path = "src/main.rs"

# 测试用的最小 MCP stdio 服务器。正式桌面进程不会启动它。
[[bin]]
name = "orange-mcp-fixture"
path = "src/mcp_fixture_bin.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
genpdf = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
# 与 rmcp 3.5.1 对齐到 reqwest 0.13，避免依赖图中出现两个 reqwest 大版本导致类型不匹配。
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
scraper = "0.22"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.36"
pdf-extract = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tempfile = "3"
thiserror = "1"
trash = "5.2.6"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-log = "2.8.0"
log = "0.4"
tauri-plugin-opener = "2"
# IM 网关需要按通道异步串行化会话读写，避免并发事件覆盖持久化快照。
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
# MCP streamable HTTP 传输的 custom_headers 需要 http 1.x 的 HeaderName/HeaderValue，与 rmcp 内部版本保持一致。
http = "1"
# MCP 客户端只启用 stdio 与 streamable HTTP，不带服务端、OAuth 或旧 SSE。
rmcp = { version = "3.5.1", default-features = false, features = [
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "which-command",
] }

[target.'cfg(windows)'.dependencies]
# Windows 首版使用无管理员权限的 AppContainer + Job Object 作为强隔离边界。
sandboxrs-windows = "0.1.1"
# 动态链接官方预编译库。静态包是 MT 运行库，和 Tauri 默认的 MD 运行库会冲突。
cpal = "0.15"
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
